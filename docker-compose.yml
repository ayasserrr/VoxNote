# VoxNote — full production-style stack
#   cp .env.example .env   (add at least one free API key)
#   docker compose up --build
# UI:  http://localhost:3000     API docs: http://localhost:8000/docs
#
# Services: PostgreSQL · Redis · FastAPI API · Celery worker · React (nginx)
# Optional: `docker compose --profile monitoring up` adds Prometheus (http://localhost:9090)

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://voxnote:voxnote@postgres:5432/voxnote
    REDIS_URL: redis://redis:6379/0
    TASK_BACKEND: celery
    DB_AUTO_CREATE: "false"
    STORAGE_DIR: /app/data/storage
    CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    # Lets the containers reach Ollama running on your host machine.
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - voxnote-storage:/app/data/storage
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voxnote
      POSTGRES_PASSWORD: voxnote
      POSTGRES_DB: voxnote
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxnote"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2}
    healthcheck:
      disable: true
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

volumes:
  pgdata:
  voxnote-storage:
